[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ethiopian-food-vision"
version = "0.1.0"
description = "A research-oriented 11-class Ethiopian food image classifier"
requires-python = ">=3.10"
license = {text = "MIT"}
readme = "README.md"
dependencies = [
  "Pillow>=10.0,<13",
  "numpy>=1.26,<3",
  "pyarrow>=15.0,<24",
  "scikit-learn>=1.4,<2",
  "matplotlib>=3.8,<4",
  "gradio>=5.0,<7",
]

[project.optional-dependencies]
test = ["pytest>=8.0,<9", "ruff>=0.8,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
